<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Newarkian Ave</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Work+Sans:wght@400;600&display=swap">
<style>
:root{--bg:#f1ede4;--panel:#e4ded1;--ink:#1c1a17;--mute:#6b645a;--brick:#a8342a;--lamp:#c27a10;--die:#fbf9f4;--pip:#1c1a17;--win:#2f7a3d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171f;--panel:#1d212c;--ink:#ece7dc;--mute:#9a958a;--brick:#d4503f;--lamp:#f2a93b;--die:#ece7dc;--pip:#14171f;--win:#6cc47c}}
:root[data-theme="dark"]{--bg:#14171f;--panel:#1d212c;--ink:#ece7dc;--mute:#9a958a;--brick:#d4503f;--lamp:#f2a93b;--die:#ece7dc;--pip:#14171f;--win:#6cc47c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Work Sans",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
.f{font-family:"Archivo Black",Impact,sans-serif;font-weight:400}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:20px}
h1{font-size:clamp(1.6rem,7vw,2.3rem);margin:0;letter-spacing:-.01em;line-height:1}
.chips{font-size:1.4rem;color:var(--lamp);white-space:nowrap}
.chips small{display:block;font:600 .75rem "Work Sans",sans-serif;color:var(--mute);text-align:right}
.back{background:none;border:0;color:var(--mute);padding:0 0 12px;font-weight:600;cursor:pointer;font-size:1rem}
.lead{color:var(--mute);margin:0 0 18px}
.block{display:grid;gap:12px}
.game{display:block;text-align:left;width:100%;background:var(--panel);border:0;border-left:8px solid var(--brick);border-radius:10px;padding:16px;color:var(--ink);cursor:pointer;font:inherit}
.game .f{font-size:1.3rem;display:block;margin-bottom:4px}
.game span.b{color:var(--mute)}
.game.live{border-left-color:var(--lamp)}
.game[disabled]{opacity:.55;cursor:default;border-left-style:dashed}
.tag{float:right;font-size:.8rem;font-weight:600;color:var(--lamp)}
.wall{height:46px;border-radius:8px 8px 0 0;margin-bottom:12px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;font-size:.8rem;font-weight:600;color:#f1ede4;background:repeating-linear-gradient(0deg,transparent 0 14px,rgba(0,0,0,.3) 14px 16px),repeating-linear-gradient(90deg,transparent 0 38px,rgba(0,0,0,.3) 38px 40px),var(--brick)}
.stage{position:relative;height:250px;margin-bottom:12px;border-radius:8px;overflow:hidden;background:linear-gradient(var(--panel),color-mix(in srgb,var(--panel),var(--ink) 18%))}
.stage .wall{height:70px;margin:0;border-radius:0}
.floor{position:absolute;inset:70px 0 0 0}
.stage .die{position:absolute;width:44px;height:44px;padding:6px;border-radius:9px;z-index:3}
.who{position:absolute;bottom:6px;font-size:.8rem;font-weight:600;color:var(--mute)}.who.l{left:10px}.who.r{right:10px}
.bill{position:absolute;width:46px;height:22px;border-radius:3px;background:#5f9b62;border:1px solid #2f6b3a;color:#e8f3e1;font:600 .7rem "Work Sans",sans-serif;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 0 rgba(0,0,0,.35)}
.bill.drop{animation:drop .5s ease-out both}
@keyframes drop{from{transform:translateY(-60px) rotate(40deg);opacity:0}}
.pot{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;font-size:1.3rem}.pot .pv{color:var(--lamp)}
.seat{background:var(--panel);border-radius:10px;padding:14px 16px;margin-bottom:12px;border-left:6px solid var(--brick)}
.seat.you{border-left-color:var(--lamp)}
.seat h2{margin:0 0 10px;font-size:1rem;display:flex;justify-content:space-between}
.seat h2 span{color:var(--mute);font-weight:400}
.dice{display:flex;gap:12px;min-height:64px}
.die{width:64px;height:64px;background:var(--die);border-radius:12px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:9px;gap:2px;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.die i{border-radius:50%;background:var(--pip);width:100%;height:100%;grid-area:var(--a);display:block;transform:scale(.85)}
.die.empty{background:transparent;box-shadow:none;border:2px dashed var(--mute);opacity:.4}
.die.shake{animation:tumble .5s}
@keyframes tumble{0%{transform:rotate(0) translateY(0)}25%{transform:rotate(-40deg) translateY(-14px)}60%{transform:rotate(30deg) translateY(4px)}100%{transform:rotate(0)}}
@media (prefers-reduced-motion:reduce){.die.shake{animation:none}}
.msg{min-height:3.2em;font-size:1.05rem;margin:16px 0}
.msg b{font-family:"Archivo Black",Impact,sans-serif;font-weight:400;font-size:1.25rem}
.win{color:var(--win)}.lose{color:var(--brick)}
.bets{display:flex;gap:8px;margin-bottom:14px}.bets button{flex:1}
button.o{font:inherit;font-weight:600;border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:10px;padding:12px 8px;cursor:pointer}
button.o[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
button:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
.go{width:100%;background:var(--brick);border:0;color:#fff;font-family:"Archivo Black",Impact,sans-serif;font-size:1.2rem;padding:16px;border-radius:10px;cursor:pointer}
details{margin-top:24px;color:var(--mute);font-size:.92rem;line-height:1.5}
summary{cursor:pointer;color:var(--ink);font-weight:600}
</style>
</head>
<body>
<main>
<header><h1 class="f">Newarkian Casino</h1><div class="chips f"><small>Your chips</small><span id="chips">500</span></div></header>
<div id="view"></div>
</main>
<script>
/* ---------- Casino core: wallet + game registry ---------- */
const Wallet={chips:500,add(n){this.chips+=n;this.draw()},reset(){this.chips=500;this.draw()},draw(){document.getElementById("chips").textContent=this.chips}};
const Games=[];
const Casino={register(g){Games.push(g)}};
const view=document.getElementById("view");let unmount=null;
function route(){
  if(unmount){unmount();unmount=null}
  const g=Games.find(x=>x.id===location.hash.slice(1)&&!x.soon);
  view.replaceChildren();
  g?openGame(g):lobby();
}
function lobby(){
  const p=document.createElement("p");p.className="lead";p.textContent="Pick a game. Everyone starts on the same stack.";
  const b=document.createElement("div");b.className="block";
  Games.forEach(g=>{const e=document.createElement("button");e.className="game"+(g.soon?"":" live");e.disabled=!!g.soon;
    e.innerHTML='<span class="tag">'+(g.soon?"Soon":"Play")+'</span><span class="f"></span><span class="b"></span>';
    e.children[1].textContent=g.name;e.children[2].textContent=g.blurb;
    e.onclick=()=>{location.hash=g.id};b.appendChild(e)});
  view.append(p,b);
}
function openGame(g){
  const back=document.createElement("button");back.className="back";back.textContent="‹ Back to the block";back.onclick=()=>{location.hash=""};
  const root=document.createElement("div");view.append(back,root);
  unmount=g.mount(root,Wallet)||null;
}
window.addEventListener("hashchange",route);

/* ---------- Game: C-Lo ---------- */
Casino.register({id:"clo",name:"C-Lo",blurb:"Two players, one pot. Throw off the wall. 4-5-6 takes it.",mount(root,W){
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  const PIPS={1:["2/2"],2:["1/1","3/3"],3:["1/1","2/2","3/3"],4:["1/1","1/3","3/1","3/3"],5:["1/1","1/3","2/2","3/1","3/3"],6:["1/1","2/1","3/1","1/3","2/3","3/3"]};
  let bet=25,phase="bet",pot=0,pend=null,youFirst=false,busy=false,alive=true;
  const who={you:{d:".pd",l:".pres",n:"You"},opp:{d:".bd",l:".bres",n:"Opponent"}};
  const vb=(s,w)=>s==="you"?w:w+"s";
  root.innerHTML='<div class="stage"><div class="wall">Throw the dice off this wall</div><div class="floor"></div><span class="who l">Opponent</span><span class="who r">You</span></div><div class="pot f"><span>Pot</span><span class="pv">0</span></div><section class="seat"><h2>Opponent <span class="bres">Waiting</span></h2><div class="dice bd"></div></section><section class="seat you"><h2>You <span class="pres">Waiting</span></h2><div class="dice pd"></div></section><div class="msg" aria-live="polite">Pick your ante, then ante up.</div><div class="bets" role="group" aria-label="Bet size"></div><button class="go">Ante up</button><button class="o mute" style="margin-top:10px;width:100%">Sound: on</button><button class="o fxb" style="margin-top:10px;width:100%">Motion: on</button><details><summary>How rolls score</summary><p>Each player antes the same bet into the pot. No banker and no third man, just two players. Dice have to hit the wall. 4-5-6, any triple, or a pair with a 6 wins the pot. 1-2-3 or a pair with a 1 loses it. A pair with 2 to 5 sets a point, and anything else rerolls. The first shooter sets the point and the other player throws to beat it. Equal points are a tie: the pot stays and you shoot again. The first shooter switches every round.</p></details>';
  const q=s=>root.querySelector(s),go=q(".go"),betsEl=q(".bets");
  function dieEl(n,sh){const d=document.createElement("div");d.className="die"+(n?"":" empty")+(sh?" shake":"");
    if(n)PIPS[n].forEach(p=>{const[r,c]=p.split("/"),i=document.createElement("i");i.style.setProperty("--a",r+"/"+c);d.appendChild(i)});return d}
  const show=(sel,dice,sh)=>q(sel).replaceChildren(...(dice||[0,0,0]).map(n=>dieEl(n,sh)));
  function judge(d){const s=[...d].sort((a,b)=>a-b),k=s.join("");
    if(k==="456")return{t:"win",l:"4-5-6"};if(k==="123")return{t:"lose",l:"1-2-3"};
    if(s[0]===s[2])return{t:"win",l:"Triple "+s[0]};
    if(s[0]===s[1]||s[1]===s[2]){const o=s[0]===s[1]?s[2]:s[0];
      if(o===6)return{t:"win",l:"Point 6"};if(o===1)return{t:"lose",l:"Point 1"};return{t:"point",p:o,l:"Point "+o}}
    return{t:"again",l:"No score"}}
  let ac=null,muted=false,fx=true;
  function tone(f,t,dur,type,vol){if(!ac||muted)return;const o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+t;o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(vol||.15,s);g.gain.exponentialRampToValueAtTime(.001,s+dur);o.connect(g);g.connect(ac.destination);o.start(s);o.stop(s+dur)}
  function clack(){for(let i=0;i<5;i++)tone(180+Math.random()*500,.35+i*.09,.05,"square",.08)}
  function sweep(w){const f=q(".floor"),dx=(w==="you"?1:-1)*f.clientWidth*.45;
    if(!fx)return drawBills();
    [...f.children].forEach((b,i)=>b.animate([{},{transform:b.style.transform+" translate("+dx+"px,60px)",opacity:0}],{duration:700,delay:i*25,fill:"forwards"}));
    setTimeout(()=>{if(alive)drawBills()},700+f.children.length*25)}
  let shown=0;
  function drawBills(){
    const f=q(".floor"),n=Math.min(18,Math.ceil(pot/10));
    if(n<shown||!n){f.replaceChildren();shown=0}
    for(;shown<n;shown++){const b=document.createElement("div");b.className="bill drop";b.textContent="$";
      b.style.left=(28+Math.random()*34)+"%";b.style.top=(22+Math.random()*50)+"%";b.style.transform="rotate("+(Math.random()*120-60)+"deg)";f.appendChild(b)}}
  function toss(d,side){
    const st=q(".stage");clack();st.querySelectorAll(".die").forEach(e=>e.remove());
    d.forEach((n,i)=>{const e=dieEl(n);st.appendChild(e);
      const sx=side==="you"?78:12,wx=38+i*12+Math.random()*6,lx=30+i*14+Math.random()*6,ly=38+Math.random()*28;
      e.style.left=lx+"%";e.style.top=ly+"%";
      if(!fx)return;
      e.animate([{left:sx+"%",top:"100%",transform:"rotate(0deg)"},{left:wx+"%",top:"26%",transform:"rotate(300deg)",offset:.45},{left:lx+"%",top:ly+"%",transform:"rotate("+(500+Math.random()*200)+"deg)"}],{duration:900+i*80,easing:"ease-out"})})}
  async function rollFor(dsel,lsel){let j;do{const d=[1,2,3].map(()=>1+Math.floor(Math.random()*6));
    toss(d,dsel===".pd"?"you":"opp");j=judge(d);q(lsel).textContent="Rolling";await sleep(1100);show(dsel,d);if(!alive)return j;q(lsel).textContent=j.l;
    if(j.t==="again")await sleep(500)}while(j.t==="again"&&alive);return j}
  const msg=h=>{q(".msg").innerHTML=h};
  function settle(w,text){
    if(!alive)return;
    let cls="",x;
    if(w==="you"){W.add(pot);cls="win";x=" You take the pot, +"+pot/2+" profit.";pot=0}
    else if(w==="opp"){cls="lose";x=" You drop "+pot/2+".";pot=0}
    else x=" Tie. The pot stays. Shoot again.";
    youFirst=!youFirst;q(".pv").textContent=pot;if(w==="you"||w==="opp")sweep(w);else drawBills();
    if(w==="you"){tone(660,0,.12);tone(880,.12,.25)}else if(w==="opp")tone(160,0,.35,"sawtooth",.1);
    msg('<b class="'+cls+'">'+text+'</b>'+x);
    phase=pot===0&&W.chips<=0?"broke":"bet";
    go.textContent=phase==="broke"?"Rebuy 500":pot?"Shoot again":"Ante up";
    renderBets();busy=false;go.disabled=false}
  async function throwFor(side,j1){
    const oth=side==="you"?"opp":"you",j=await rollFor(who[side].d,who[side].l);if(!alive)return;
    const n=who[side].n;
    if(j.t==="win")return settle(side,n+" "+vb(side,"hit")+" "+j.l+".");
    if(j.t==="lose")return settle(oth,n+" "+vb(side,"bust")+" on "+j.l+".");
    if(!j1){
      if(oth==="opp"){msg("You set "+j.l+". Opponent throws…");return throwFor("opp",j)}
      pend=j;phase="you";go.textContent="Throw";msg("Opponent sets "+j.l+". Your throw.");busy=false;go.disabled=false;return}
    if(j.p>j1.p)return settle(side,"Point "+j.p+" beats point "+j1.p+".");
    if(j.p<j1.p)return settle(oth,"Point "+j1.p+" beats point "+j.p+".");
    settle(null,"Both on "+j.p+".")}
  async function play(){
    if(busy)return;
    if(phase==="broke"){W.reset();phase="bet";bet=25;go.textContent="Ante up";msg("Fresh stack. Pick your ante.");renderBets();return}
    busy=true;go.disabled=true;
    if(phase==="bet"){
      if(!pot){if(bet>W.chips)bet=W.chips;W.add(-bet);pot=bet*2}
      q(".pv").textContent=pot;drawBills();renderBets();show(".pd");show(".bd");q(".pres").textContent="Waiting";q(".bres").textContent="Waiting";
      if(youFirst){pend=null;phase="you";go.textContent="Throw";msg("Ante's in. Your throw.");busy=false;go.disabled=false;return}
      msg("Opponent throws…");return throwFor("opp",null)}
    msg("You throw…");await throwFor("you",pend)}
  function renderBets(){betsEl.replaceChildren();
    [10,25,50,100].forEach(v=>{const x=document.createElement("button");x.className="o";x.textContent=v;
      x.setAttribute("aria-pressed",String(v===bet));x.disabled=phase!=="bet"||pot>0||v>W.chips;
      x.onclick=()=>{bet=v;renderBets()};betsEl.appendChild(x)})}
  go.onclick=()=>{if(!ac)try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}
  if(ac&&ac.state==="suspended")ac.resume();play()};
  q(".mute").onclick=e=>{muted=!muted;e.currentTarget.textContent="Sound: "+(muted?"off":"on")};
  q(".fxb").onclick=e=>{fx=!fx;e.currentTarget.textContent="Motion: "+(fx?"on":"off")};show(".bd");show(".pd");renderBets();
  return()=>{alive=false}
}});

/* ---------- Placeholders: swap these for real games with Casino.register ---------- */
[["dominoes","Dominoes","Slam it on the table. Double-six rules."],
 ["spades","Spades","Bid it, book it, don't get set."],
 ["tonk","Tonk","Fast hands, quick drops, cash out."]
].forEach(([id,name,blurb])=>Casino.register({id,name,blurb,soon:true}));

Wallet.draw();route();
</script>
</body>
</html>
